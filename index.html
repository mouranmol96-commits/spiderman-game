<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Anmol Web Master - Superhero Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071326;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
    user-select:none;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    z-index:10;
    top:9px;
    left:10px;
    right:10px;

    min-height:58px;
    padding:9px 16px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    background:rgba(0,0,0,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;

    pointer-events:none;
}

.logo{
    color:#ff3030;
    font-size:clamp(15px,2.3vw,28px);
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
    text-shadow:0 0 8px #ff0000;
}

.stats{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:clamp(7px,1.8vw,20px);

    color:white;
    font-size:clamp(11px,1.7vw,20px);
    font-weight:bold;
    white-space:nowrap;
}

.health{
    color:#ff4545;
}

.score{
    color:#ffd329;
}

.high{
    color:#63ff63;
}

.enemy-count{
    color:#d98cff;
}

/* ================= MOBILE CONTROLS ================= */

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:18px;
    bottom:20px;

    width:116px;
    height:116px;

    border:3px solid rgba(255,255,255,.48);
    border-radius:50%;

    background:rgba(255,255,255,.12);
    box-shadow:0 0 15px rgba(255,255,255,.08);

    pointer-events:auto;
}

#stick{
    position:absolute;
    left:29px;
    top:29px;

    width:52px;
    height:52px;

    border-radius:50%;
    background:rgba(225,230,240,.85);
    box-shadow:0 0 10px rgba(255,255,255,.25);

    transition:transform .04s linear;
}

.mobile-btn{
    position:absolute;

    width:75px;
    height:75px;

    border:3px solid rgba(255,255,255,.95);
    border-radius:50%;

    color:white;
    font-size:12px;
    font-weight:900;

    pointer-events:auto;
    touch-action:none;

    box-shadow:0 4px 12px rgba(0,0,0,.35);
}

.mobile-btn:active{
    transform:scale(.9);
    filter:brightness(1.3);
}

#jumpBtn{
    right:20px;
    bottom:185px;
    background:#c52331;
}

#attackBtn{
    right:112px;
    bottom:20px;
    background:#c52331;
}

#webBtn{
    right:20px;
    bottom:20px;
    background:#2858cc;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.86);
    color:white;
    text-align:center;
}

.game-over-box{
    width:min(90%,430px);
    padding:30px 22px;

    border:2px solid #00cfff;
    border-radius:22px;

    background:linear-gradient(
        145deg,
        #111d32,
        #07101f
    );

    box-shadow:
    0 0 25px rgba(0,190,255,.55),
    inset 0 0 25px rgba(0,100,255,.08);
}

.game-over-box h1{
    color:#ff3545;
    font-size:clamp(34px,8vw,52px);
    margin-bottom:15px;
    text-shadow:0 0 12px red;
}

.game-over-box p{
    font-size:20px;
    margin:11px;
}

#restart{
    margin-top:17px;
    padding:13px 30px;

    border:0;
    border-radius:12px;

    background:#00bfff;
    color:white;

    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#restart:active{
    transform:scale(.94);
}

/* ================= ROTATE MESSAGE ================= */

#rotateMessage{
    display:none;

    position:fixed;
    inset:0;
    z-index:100;

    align-items:center;
    justify-content:center;

    background:#050505;
    color:white;
    text-align:center;

    font-size:23px;
    font-weight:bold;
    padding:20px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px) and (orientation:landscape){

    #mobileControls{
        display:block;
    }

    #hud{
        top:5px;
        left:7px;
        right:7px;
        min-height:48px;
        padding:6px 10px;
        border-radius:12px;
    }

    .logo{
        font-size:18px;
    }

    .stats{
        font-size:13px;
        gap:8px;
    }

    #joystick{
        width:102px;
        height:102px;
        left:14px;
        bottom:14px;
    }

    #stick{
        width:46px;
        height:46px;
        left:25px;
        top:25px;
    }

    .mobile-btn{
        width:67px;
        height:67px;
        font-size:11px;
    }

    #jumpBtn{
        right:16px;
        bottom:163px;
    }

    #attackBtn{
        right:96px;
        bottom:16px;
    }

    #webBtn{
        right:16px;
        bottom:16px;
    }
}

@media(max-width:850px) and (orientation:portrait){

    #rotateMessage{
        display:flex;
    }

    #hud,
    #mobileControls{
        display:none;
    }
}

@media(max-height:430px) and (orientation:landscape){

    #hud{
        min-height:40px;
        padding:4px 8px;
    }

    .logo{
        font-size:14px;
    }

    .stats{
        font-size:10px;
        gap:5px;
    }

    #joystick{
        width:82px;
        height:82px;
        left:9px;
        bottom:8px;
    }

    #stick{
        width:38px;
        height:38px;
        left:19px;
        top:19px;
    }

    .mobile-btn{
        width:55px;
        height:55px;
        font-size:9px;
    }

    #jumpBtn{
        right:9px;
        bottom:112px;
    }

    #attackBtn{
        right:72px;
        bottom:8px;
    }

    #webBtn{
        right:9px;
        bottom:8px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="logo">ANMOL WEB MASTER</div>

    <div class="stats">
        <span class="health">
            ❤️ <span id="healthValue">100</span>
        </span>

        <span class="score">
            ⭐ Score: <span id="scoreValue">0</span>
        </span>

        <span class="high">
            🏆 High: <span id="highValue">0</span>
        </span>

        <span class="enemy-count">
            👾 <span id="enemyValue">0</span>
        </span>
    </div>

</div>

<!-- Mobile controls -->
<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button class="mobile-btn" id="jumpBtn">JUMP</button>
    <button class="mobile-btn" id="attackBtn">ATTACK</button>
    <button class="mobile-btn" id="webBtn">WEB</button>

</div>

<!-- Game over -->
<div id="gameOver">

    <div class="game-over-box">

        <h1>GAME OVER</h1>

        <p>
            ⭐ Your Score:
            <span id="finalScore">0</span>
        </p>

        <p>
            🏆 High Score:
            <span id="finalHigh">0</span>
        </p>

        <p>Better Luck Next Time! 💪</p>

        <button id="restart">PLAY AGAIN</button>

    </div>

</div>

<!-- Portrait message -->
<div id="rotateMessage">
    <div>
        📱<br><br>
        Please rotate your phone to<br>
        <b>LANDSCAPE MODE</b>
    </div>
</div>

<script>
"use strict";

/* =====================================================
   CANVAS SETUP
===================================================== */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;
let pixelRatio = 1;

function resizeCanvas(){

    W = window.innerWidth;
    H = window.innerHeight;

    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * pixelRatio);
    canvas.height = Math.floor(H * pixelRatio);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}

window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 200);
});

resizeCanvas();

/* =====================================================
   GAME VARIABLES
===================================================== */

let player;
let enemies = [];
let webs = [];
let attacks = [];
let particles = [];
let stars = [];
let clouds = [];

let score = 0;
let highScore = Number(
    localStorage.getItem("anmolWebMasterHighScore")
) || 0;

let gameRunning = true;
let spawnTimer = 0;
let worldTime = 0;

const MAX_ENEMIES = 1000;

/* =====================================================
   INPUT
===================================================== */

const keys = {};

window.addEventListener("keydown", function(e){

    const key = e.key.toLowerCase();
    keys[key] = true;

    if(e.code === "Space"){
        e.preventDefault();
        jump();
    }

    if(key === "w"){
        jump();
    }

    if(key === "f"){
        attack();
    }

    if(key === "e"){
        shootWeb();
    }

    if(key === "r" && !gameRunning){
        restartGame();
    }
});

window.addEventListener("keyup", function(e){
    keys[e.key.toLowerCase()] = false;
});

/* PC mouse controls */
window.addEventListener("mousedown", function(e){

    if(!gameRunning) return;

    if(e.button === 0){
        attack();
    }

    if(e.button === 2){
        shootWeb();
    }
});

window.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

    player = {
        x: W * 0.5,
        y: H - 185,

        width: 42,
        height: 70,

        vx: 0,
        vy: 0,

        speed: 5.5,
        direction: 1,

        health: 100,
        grounded: true,

        attackCooldown: 0,
        webCooldown: 0,

        invincible: 0
    };
}

createPlayer();

/* =====================================================
   BACKGROUND DATA
===================================================== */

function createBackground(){

    stars = [];
    clouds = [];

    for(let i = 0; i < 100; i++){

        stars.push({
            x: Math.random() * W,
            y: Math.random() * Math.max(180, H * .55),
            size: Math.random() * 2 + 1,
            alpha: Math.random() * .7 + .3
        });
    }

    for(let i = 0; i < 8; i++){

        clouds.push({
            x: Math.random() * W,
            y: 70 + Math.random() * 120,
            width: 100 + Math.random() * 130,
            speed: .1 + Math.random() * .2
        });
    }
}

createBackground();

/* =====================================================
   SCORE SYSTEM
===================================================== */

function addScore(){

    score++;

    if(score > highScore){

        highScore = score;

        localStorage.setItem(
            "anmolWebMasterHighScore",
            String(highScore)
        );
    }
}

/* =====================================================
   ENEMY DIFFICULTY
===================================================== */

function getEnemyDamage(){

    return score >= 30 ? 30 : 10;
}

function getEnemySpeed(){

    if(score >= 30){
        return 2.2 + Math.random() * 2;
    }

    return 1.1 + Math.random() * 1.4;
}

/* =====================================================
   SPAWN ENEMIES
===================================================== */

function spawnEnemy(){

    if(enemies.length >= MAX_ENEMIES){
        return;
    }

    const fromLeft = Math.random() < .5;

    enemies.push({

        x: fromLeft ? -70 : W + 70,
        y: H - 182,

        width: 42,
        height: 62,

        speed: getEnemySpeed(),

        health: 1,
        hitCooldown: 0,
        slowTimer: 0,

        color: Math.random() < .5
            ? "#c7283c"
            : "#8128b8"
    });
}

function manageSpawning(){

    spawnTimer--;

    if(score >= 30){

        if(spawnTimer <= 0){

            const amount = Math.min(
                8,
                MAX_ENEMIES - enemies.length
            );

            for(let i = 0; i < amount; i++){
                spawnEnemy();
            }

            spawnTimer = 12;
        }

    }else{

        if(spawnTimer <= 0){

            spawnEnemy();
            spawnTimer = 65;
        }
    }
}

/* =====================================================
   PLAYER ACTIONS
===================================================== */

function jump(){

    if(!gameRunning) return;

    if(player.grounded){

        player.vy = -12.5;
        player.grounded = false;

        createParticles(
            player.x + player.width / 2,
            player.y + player.height
        );
    }
}

function attack(){

    if(
        !gameRunning ||
        player.attackCooldown > 0
    ){
        return;
    }

    player.attackCooldown = 16;

    attacks.push({

        x: player.x + (player.direction > 0 ? 25 : -60),
        y: player.y + 12,

        width: 65,
        height: 48,

        life: 10,
        direction: player.direction
    });
}

function shootWeb(){

    if(
        !gameRunning ||
        player.webCooldown > 0
    ){
        return;
    }

    player.webCooldown = 18;

    webs.push({

        x: player.x + player.width / 2,
        y: player.y + 18,

        vx: player.direction * 12,

        life: 70,
        target: null
    });
}

/* =====================================================
   COLLISION
===================================================== */

function isColliding(a,b){

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

/* =====================================================
   PARTICLES
===================================================== */

function createParticles(x,y,color="#00d9ff",amount=12){

    for(let i = 0; i < amount; i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random() - .5) * 7,
            vy:(Math.random() - .5) * 7,

            size:Math.random() * 4 + 2,
            life:25 + Math.random() * 20,

            color:color
        });
    }
}

/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer(){

    player.vx = 0;

    if(keys["a"] || keys["arrowleft"]){

        player.vx = -player.speed;
        player.direction = -1;
    }

    if(keys["d"] || keys["arrowright"]){

        player.vx = player.speed;
        player.direction = 1;
    }

    player.x += player.vx;

    player.vy += .58;
    player.y += player.vy;

    const groundY = H - 182;

    if(player.y >= groundY){

        player.y = groundY;
        player.vy = 0;
        player.grounded = true;
    }

    if(player.x < 5){
        player.x = 5;
    }

    if(player.x > W - player.width - 5){
        player.x = W - player.width - 5;
    }

    if(player.attackCooldown > 0){
        player.attackCooldown--;
    }

    if(player.webCooldown > 0){
        player.webCooldown--;
    }

    if(player.invincible > 0){
        player.invincible--;
    }
}

/* =====================================================
   UPDATE ENEMIES
===================================================== */

function updateEnemies(){

    for(let i = enemies.length - 1; i >= 0; i--){

        const enemy = enemies[i];

        if(enemy.hitCooldown > 0){
            enemy.hitCooldown--;
        }

        if(enemy.slowTimer > 0){
            enemy.slowTimer--;
        }

        const speed = enemy.slowTimer > 0
            ? enemy.speed * .25
            : enemy.speed;

        /* Enemy follows player */
        if(enemy.x < player.x){
            enemy.x += speed;
        }else{
            enemy.x -= speed;
        }

        /* Damage player */
        if(
            isColliding(enemy, player) &&
            enemy.hitCooldown <= 0 &&
            player.invincible <= 0
        ){

            player.health -= getEnemyDamage();
            enemy.hitCooldown = 45;
            player.invincible = 25;

            createParticles(
                player.x + 20,
                player.y + 25,
                "#ff3030",
                15
            );

            if(player.health <= 0){

                player.health = 0;
                endGame();
                return;
            }
        }

        /* Attack collision */
        for(let j = attacks.length - 1; j >= 0; j--){

            const hit = attacks[j];

            if(
                hit.life > 0 &&
                isColliding(hit, enemy)
            ){

                hit.life = 0;
                enemy.health--;

                createParticles(
                    enemy.x + 20,
                    enemy.y + 20,
                    "#ffd329",
                    14
                );

                if(enemy.health <= 0){

                    enemies.splice(i, 1);
                    addScore();

                    break;
                }
            }
        }

        /* Web collision */
        for(let j = webs.length - 1; j >= 0; j--){

            const web = webs[j];

            const webBox = {
                x: web.x - 9,
                y: web.y - 9,
                width: 18,
                height: 18
            };

            if(
                web.life > 0 &&
                isColliding(webBox, enemy)
            ){

                enemy.slowTimer = 150;
                web.life = 0;

                createParticles(
                    enemy.x + 20,
                    enemy.y + 20,
                    "#ffffff",
                    8
                );
            }
        }
    }
}

/* =====================================================
   UPDATE WEBS
===================================================== */

function updateWebs(){

    for(let i = webs.length - 1; i >= 0; i--){

        const web = webs[i];

        web.x += web.vx;
        web.life--;

        if(
            web.life <= 0 ||
            web.x < -100 ||
            web.x > W + 100
        ){

            webs.splice(i,1);
        }
    }
}

/* =====================================================
   UPDATE ATTACKS
===================================================== */

function updateAttacks(){

    for(let i = attacks.length - 1; i >= 0; i--){

        attacks[i].life--;

        if(attacks[i].life <= 0){
            attacks.splice(i,1);
        }
    }
}

/* =====================================================
   UPDATE PARTICLES
===================================================== */

function updateParticles(){

    for(let i = particles.length - 1; i >= 0; i--){

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .18;
        p.life--;

        if(p.life <= 0){
            particles.splice(i,1);
        }
    }
}

/* =====================================================
   BACKGROUND DRAW
===================================================== */

function drawBackground(){

    /* Sky gradient */
    const gradient = ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,"#071326");
    gradient.addColorStop(.55,"#102645");
    gradient.addColorStop(1,"#172238");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);

    /* Moon glow */
    const moonGlow = ctx.createRadialGradient(
        W - 120,
        105,
        5,
        W - 120,
        105,
        115
    );

    moonGlow.addColorStop(0,"rgba(255,255,255,.25)");
    moonGlow.addColorStop(1,"rgba(255,255,255,0)");

    ctx.fillStyle = moonGlow;
    ctx.fillRect(
        W - 240,
        0,
        240,
        230
    );

    /* Moon */
    ctx.fillStyle = "#fff";

    ctx.beginPath();
    ctx.arc(
        W - 120,
        105,
        43,
        0,
        Math.PI * 2
    );
    ctx.fill();

    /* Stars */
    for(const star of stars){

        ctx.globalAlpha = star.alpha;

        ctx.fillStyle = "#fff";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    }

    ctx.globalAlpha = 1;

    /* Clouds */
    for(const cloud of clouds){

        cloud.x -= cloud.speed;

        if(cloud.x < -cloud.width){
            cloud.x = W + cloud.width;
        }

        ctx.fillStyle = "rgba(255,255,255,.035)";

        ctx.beginPath();

        ctx.ellipse(
            cloud.x,
            cloud.y,
            cloud.width * .5,
            18,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    drawBuildings();

    /* Ground */
    ctx.fillStyle = "#242b34";
    ctx.fillRect(
        0,
        H - 182,
        W,
        182
    );

    /* Road */
    ctx.fillStyle = "#30353c";
    ctx.fillRect(
        0,
        H - 105,
        W,
        105
    );

    /* Road center line */
    ctx.strokeStyle = "#e8e8e8";
    ctx.lineWidth = 4;
    ctx.setLineDash([38,28]);

    ctx.beginPath();
    ctx.moveTo(0,H - 48);
    ctx.lineTo(W,H - 48);
    ctx.stroke();

    ctx.setLineDash([]);
}

function drawBuildings(){

    const buildingWidth = 112;

    for(
        let x = 0;
        x < W + buildingWidth;
        x += buildingWidth
    ){

        const buildingHeight =
            180 + ((x * 17) % 190);

        const buildingY =
            H - 182 - buildingHeight;

        ctx.fillStyle =
            x % 224 === 0
            ? "#142945"
            : "#0d1d34";

        ctx.fillRect(
            x,
            buildingY,
            buildingWidth - 8,
            buildingHeight
        );

        /* Roof antenna */
        if(x % 224 === 0){

            ctx.strokeStyle = "#243e60";
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(
                x + buildingWidth / 2,
                buildingY
            );
            ctx.lineTo(
                x + buildingWidth / 2,
                buildingY - 25
            );
            ctx.stroke();
        }

        /* Windows */
        for(
            let wy = buildingY + 25;
            wy < H - 200;
            wy += 43
        ){

            for(
                let wx = x + 16;
                wx < x + buildingWidth - 22;
                wx += 28
            ){

                const lit =
                    Math.sin(
                        x * .02 +
                        wx * .05 +
                        wy * .03
                    ) > -.15;

                if(lit){

                    ctx.fillStyle = "#ffd957";

                    ctx.fillRect(
                        wx,
                        wy,
                        11,
                        17
                    );
                }else{

                    ctx.fillStyle = "#263650";

                    ctx.fillRect(
                        wx,
                        wy,
                        11,
                        17
                    );
                }
            }
        }
    }
}

/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

    if(
        player.invincible > 0 &&
        Math.floor(player.invincible / 4) % 2 === 0
    ){
        return;
    }

    const x = player.x;
    const y = player.y;

    /* Shadow */
    ctx.fillStyle = "rgba(0,0,0,.45)";

    ctx.beginPath();
    ctx.ellipse(
        x + 21,
        H - 174,
        29,
        8,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();

    /* Cape / web trail */
    ctx.fillStyle = "#9e172d";

    ctx.beginPath();

    if(player.direction > 0){

        ctx.moveTo(x + 9,y + 24);
        ctx.lineTo(x - 13,y + 54);
        ctx.lineTo(x + 10,y + 48);

    }else{

        ctx.moveTo(x + 33,y + 24);
        ctx.lineTo(x + 55,y + 54);
        ctx.lineTo(x + 32,y + 48);
    }

    ctx.closePath();
    ctx.fill();

    /* Body */
    ctx.fillStyle = "#176ddd";

    ctx.roundRect(
        x + 7,
        y + 18,
        29,
        36,
        7
    );

    ctx.fill();

    /* Red chest area */
    ctx.fillStyle = "#c91e35";

    ctx.fillRect(
        x + 8,
        y + 18,
        27,
        9
    );

    /* Head mask */
    ctx.fillStyle = "#c51d35";

    ctx.beginPath();
    ctx.arc(
        x + 21,
        y + 9,
        17,
        0,
        Math.PI * 2
    );
    ctx.fill();

    /* Eyes */
    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.ellipse(
        x + 15,
        y + 7,
        4.5,
        7,
        -.3,
        0,
        Math.PI * 2
    );

    ctx.ellipse(
        x + 27,
        y + 7,
        4.5,
        7,
        .3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* Chest spider */
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(x + 21,y + 27);
    ctx.lineTo(x + 21,y + 43);

    ctx.moveTo(x + 21,y + 29);
    ctx.lineTo(x + 12,y + 34);

    ctx.moveTo(x + 21,y + 29);
    ctx.lineTo(x + 30,y + 34);

    ctx.moveTo(x + 21,y + 35);
    ctx.lineTo(x + 11,y + 41);

    ctx.moveTo(x + 21,y + 35);
    ctx.lineTo(x + 31,y + 41);

    ctx.stroke();

    /* Legs */
    ctx.strokeStyle = "#176ddd";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(x + 14,y + 52);
    ctx.lineTo(x + 9,y + 68);

    ctx.moveTo(x + 28,y + 52);
    ctx.lineTo(x + 34,y + 68);

    ctx.stroke();

    /* Web shooting hand */
    if(player.webCooldown > 10){

        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            x + (player.direction > 0 ? 32 : 10),
            y + 30
        );

        ctx.lineTo(
            x + (player.direction > 0 ? 48 : -6),
            y + 25
        );

        ctx.stroke();
    }
}

/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(const enemy of enemies){

        const x = enemy.x;
        const y = enemy.y;

        /* Shadow */
        ctx.fillStyle = "rgba(0,0,0,.35)";

        ctx.beginPath();
        ctx.ellipse(
            x + 21,
            H - 174,
            25,
            7,
            0,
            0,
            Math.PI * 2
        );
        ctx.fill();

        /* Body */
        ctx.fillStyle = enemy.color;

        ctx.roundRect(
            x + 6,
            y + 18,
            31,
            36,
            7
        );

        ctx.fill();

        /* Head */
        ctx.fillStyle = "#d13b48";

        ctx.beginPath();
        ctx.arc(
            x + 21,
            y + 9,
            16,
            0,
            Math.PI * 2
        );
        ctx.fill();

        /* Eyes */
        ctx.fillStyle = "#ffe600";

        ctx.beginPath();

        ctx.arc(
            x + 15,
            y + 8,
            3.5,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 27,
            y + 8,
            3.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /* Enemy legs */
        ctx.strokeStyle = enemy.color;
        ctx.lineWidth = 8;

        ctx.beginPath();

        ctx.moveTo(x + 14,y + 52);
        ctx.lineTo(x + 8,y + 68);

        ctx.moveTo(x + 28,y + 52);
        ctx.lineTo(x + 35,y + 68);

        ctx.stroke();

        /* Webbed / slowed effect */
        if(enemy.slowTimer > 0){

            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(
                x + 21,
                y + 30,
                28,
                0,
                Math.PI * 2
            );
            ctx.stroke();
        }
    }
}

/* =====================================================
   DRAW WEBS
===================================================== */

function drawWebs(){

    for(const web of webs){

        ctx.strokeStyle = "rgba(255,255,255,.9)";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            player.x + player.width / 2,
            player.y + 20
        );

        ctx.lineTo(
            web.x,
            web.y
        );

        ctx.stroke();

        ctx.fillStyle = "#fff";

        ctx.beginPath();
        ctx.arc(
            web.x,
            web.y,
            6,
            0,
            Math.PI * 2
        );
        ctx.fill();

        /* Small web lines */
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;

        for(let i = 0; i < 4; i++){

            ctx.beginPath();

            ctx.moveTo(web.x,web.y);

            ctx.lineTo(
                web.x + Math.cos(i * Math.PI / 2) * 12,
                web.y + Math.sin(i * Math.PI / 2) * 12
            );

            ctx.stroke();
        }
    }
}

/* =====================================================
   DRAW ATTACKS
===================================================== */

function drawAttacks(){

    for(const hit of attacks){

        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";

        ctx.beginPath();

        ctx.moveTo(
            hit.x,
            hit.y + 25
        );

        ctx.lineTo(
            hit.x + hit.direction * 45,
            hit.y
        );

        ctx.stroke();

        ctx.lineCap = "butt";
    }
}

/* =====================================================
   DRAW PARTICLES
===================================================== */

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha = Math.max(
            0,
            p.life / 45
        );

        ctx.fillStyle = p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}

/* =====================================================
   MAIN UPDATE
===================================================== */

function update(){

    if(!gameRunning) return;

    worldTime++;

    updatePlayer();
    manageSpawning();
    updateEnemies();
    updateWebs();
    updateAttacks();
    updateParticles();

    document.getElementById("healthValue").textContent =
        player.health;

    document.getElementById("scoreValue").textContent =
        score;

    document.getElementById("highValue").textContent =
        highScore;

    document.getElementById("enemyValue").textContent =
        enemies.length;
}

/* =====================================================
   MAIN DRAW
===================================================== */

function draw(){

    drawBackground();
    drawWebs();
    drawEnemies();
    drawAttacks();
    drawParticles();
    drawPlayer();
}

/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();

/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    gameRunning = false;

    document.getElementById("finalScore").textContent =
        score;

    document.getElementById("finalHigh").textContent =
        highScore;

    document.getElementById("gameOver").style.display =
        "flex";
}

/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    score = 0;

    enemies = [];
    webs = [];
    attacks = [];
    particles = [];

    createPlayer();

    spawnTimer = 0;
    gameRunning = true;

    document.getElementById("gameOver").style.display =
        "none";
}

document.getElementById("restart").addEventListener(
    "click",
    restartGame
);

/* =====================================================
   MOBILE BUTTONS
===================================================== */

function addTouchButton(id, action){

    const button = document.getElementById(id);

    button.addEventListener(
        "touchstart",
        function(e){
            e.preventDefault();
            action();
        },
        {passive:false}
    );

    button.addEventListener(
        "mousedown",
        function(e){
            e.preventDefault();
            action();
        }
    );
}

addTouchButton("jumpBtn", jump);
addTouchButton("attackBtn", attack);
addTouchButton("webBtn", shootWeb);

/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;

function moveJoystick(clientX, clientY){

    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const maxDistance = 38;

    const distance = Math.sqrt(
        dx * dx + dy * dy
    );

    if(distance > maxDistance){

        dx = dx / distance * maxDistance;
        dy = dy / distance * maxDistance;
    }

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;

    if(dx < -10){

        keys["a"] = true;
        keys["d"] = false;

    }else if(dx > 10){

        keys["d"] = true;
        keys["a"] = false;

    }else{

        keys["a"] = false;
        keys["d"] = false;
    }
}

joystick.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        joystickActive = true;

        const touch = e.touches[0];

        moveJoystick(
            touch.clientX,
            touch.clientY
        );
    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();

        if(!joystickActive) return;

        const touch = e.touches[0];

        moveJoystick(
            touch.clientX,
            touch.clientY
        );
    },
    {passive:false}
);

function stopJoystick(){

    joystickActive = false;

    keys["a"] = false;
    keys["d"] = false;

    stick.style.transform =
        "translate(0,0)";
}

joystick.addEventListener(
    "touchend",
    function(e){

        e.preventDefault();
        stopJoystick();
    },
    {passive:false}
);

joystick.addEventListener(
    "touchcancel",
    function(e){

        e.preventDefault();
        stopJoystick();
    },
    {passive:false}
);

/* Prevent scrolling */
document.addEventListener(
    "touchmove",
    function(e){
        e.preventDefault();
    },
    {passive:false}
);

</script>
