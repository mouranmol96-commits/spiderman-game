<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Web Hero Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07101c;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

/* PC controls */
#pcControls{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.7);
    padding:10px 18px;
    border-radius:10px;
    z-index:10;
}

/* Mobile controls */
#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    border:3px solid rgba(255,255,255,.5);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
}

.action{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(200,30,30,.75);
    color:white;
    font-size:13px;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
}

#jump{
    right:30px;
    bottom:120px;
}

#web{
    right:115px;
    bottom:45px;
}

#attack{
    right:30px;
    bottom:35px;
}

#rotateMessage{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#07101c;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:24px;
    padding:30px;
}

@media (pointer:coarse){
    #pcControls{
        display:none;
    }

    #mobileControls{
        display:block;
    }
}

/* Portrait mobile */
@media (pointer:coarse) and (orientation:portrait){
    #rotateMessage{
        display:flex;
    }

    #mobileControls,
    canvas{
        visibility:hidden;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="pcControls">
    A / D = Run &nbsp; | &nbsp;
    W / SPACE = Jump &nbsp; | &nbsp;
    E = Web &nbsp; | &nbsp;
    R = Release
</div>

<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button class="action" id="jump">JUMP</button>
    <button class="action" id="web">WEB</button>
    <button class="action" id="attack">ATTACK</button>

</div>

<div id="rotateMessage">
    📱<br><br>
    Please rotate your phone<br>
    to Landscape Mode
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}

resize();
window.addEventListener("resize",resize);

const keys={};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(
        e.key===" " ||
        e.key==="ArrowUp" ||
        e.key==="ArrowDown"
    ){
        e.preventDefault();
    }

    if(e.key.toLowerCase()==="e"){
        shootWeb();
    }

    if(e.key.toLowerCase()==="r"){
        releaseWeb();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


/* PLAYER */

const player={
    x:300,
    y:300,
    vx:0,
    vy:0,
    width:35,
    height:65,
    speed:7,
    jump:-14,
    grounded:false,
    web:null
};


/* CITY */

const buildings=[];

let bx=-500;

while(bx<15000){

    const width=150+Math.random()*150;
    const height=200+Math.random()*350;

    buildings.push({
        x:bx,
        width:width,
        height:height,
        y:canvas.height-height
    });

    bx+=width+25;
}


function groundY(x){

    for(const b of buildings){

        if(
            x>=b.x &&
            x<=b.x+b.width
        ){
            return b.y;
        }
    }

    return canvas.height;
}


/* WEB */

function shootWeb(){

    if(player.web) return;

    let closest=null;
    let distance=700;

    for(const b of buildings){

        const ax=b.x+b.width/2;
        const ay=b.y;

        const d=Math.hypot(
            ax-player.x,
            ay-player.y
        );

        if(
            d<distance &&
            ay<player.y
        ){
            distance=d;

            closest={
                x:ax,
                y:ay
            };
        }
    }

    if(closest){
        player.web=closest;
    }
}


function releaseWeb(){
    player.web=null;
}


/* MOBILE JOYSTICK */

let joystickActive=false;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;

function joystickMove(x,y){

    const rect=joystick.getBoundingClientRect();

    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;

    let dx=x-centerX;
    let dy=y-centerY;

    const max=45;

    const d=Math.hypot(dx,dy);

    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=(33+dx)+"px";
    stick.style.top=(33+dy)+"px";

    joyX=dx/max;
    joyY=dy/max;
}


joystick.addEventListener("pointerdown",e=>{
    joystickActive=true;
    joystick.setPointerCapture(e.pointerId);
    joystickMove(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
    if(joystickActive){
        joystickMove(e.clientX,e.clientY);
    }
});

joystick.addEventListener("pointerup",()=>{
    joystickActive=false;

    joyX=0;
    joyY=0;

    stick.style.left="33px";
    stick.style.top="33px";
});


/* MOBILE BUTTONS */

function touchButton(id,down,up){

    const el=document.getElementById(id);

    el.addEventListener("pointerdown",e=>{
        e.preventDefault();
        down();
    });

    el.addEventListener("pointerup",e=>{
        e.preventDefault();

        if(up) up();
    });

    el.addEventListener("pointercancel",()=>{
        if(up) up();
    });
}

touchButton(
    "jump",
    ()=>{
        if(player.grounded){
            player.vy=player.jump;
            player.grounded=false;
        }
    }
);

touchButton(
    "web",
    ()=>{
        shootWeb();
    },
    ()=>{
        releaseWeb();
    }
);

touchButton(
    "attack",
    ()=>{
        attack();
    }
);


function attack(){

    /* simple attack */
    player.vx += player.vx>=0 ? 3 : -3;
}


/* UPDATE */

function update(){

    /* PC */

    if(keys["a"] || keys["arrowleft"]){
        player.vx-=0.7;
    }

    if(keys["d"] || keys["arrowright"]){
        player.vx+=0.7;
    }

    /* MOBILE */

    if(Math.abs(joyX)>0.1){
        player.vx+=joyX*0.8;
    }

    if(player.vx>player.speed)
        player.vx=player.speed;

    if(player.vx<-player.speed)
        player.vx=-player.speed;

    /* jump */

    if(
        (
            keys["w"] ||
            keys["arrowup"] ||
            keys[" "]
        ) &&
        player.grounded
    ){
        player.vy=player.jump;
        player.grounded=false;
    }

    /* web swing */

    if(player.web){

        const dx=player.web.x-player.x;
        const dy=player.web.y-player.y;

        const d=Math.hypot(dx,dy);

        if(d>100){

            player.vx+=dx/d*0.12;
            player.vy+=dy/d*0.12;
        }
    }

    player.vx*=0.90;

    player.vy+=0.7;

    player.x+=player.vx;
    player.y+=player.vy;

    const ground=groundY(player.x);

    if(player.y+player.height/2>=ground){

        player.y=
            ground-player.height/2;

        player.vy=0;
        player.grounded=true;

    }else{

        player.grounded=false;
    }
}


/* DRAW */

function draw(){

    /* sky */

    const sky=ctx.createLinearGradient(
        0,0,0,canvas.height
    );

    sky.addColorStop(0,"#071a38");
    sky.addColorStop(1,"#18283d");

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /* moon */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        canvas.width-100,
        90,
        35,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* camera */

    const cameraX=
        player.x-canvas.width*0.35;


    /* buildings */

    for(const b of buildings){

        const x=b.x-cameraX;

        if(
            x+b.width<0 ||
            x>canvas.width
        ) continue;

        ctx.fillStyle="#101a2a";

        ctx.fillRect(
            x,
            b.y,
            b.width,
            b.height
        );

        /* windows */

        for(
            let wx=x+15;
            wx<x+b.width-10;
            wx+=30
        ){

            for(
                let wy=b.y+25;
                wy<canvas.height-20;
                wy+=40
            ){

                ctx.fillStyle="#f5d35e";

                ctx.fillRect(
                    wx,
                    wy,
                    12,
                    18
                );
            }
        }
    }


    /* web */

    if(player.web){

        ctx.strokeStyle="white";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            player.x-cameraX,
            player.y-20
        );

        ctx.lineTo(
            player.web.x-cameraX,
            player.web.y
        );

        ctx.stroke();
    }


    /* PLAYER */

    const px=player.x-cameraX;
    const py=player.y;

    ctx.save();

    ctx.translate(px,py);

    /* head */

    ctx.fillStyle="#d92828";

    ctx.beginPath();

    ctx.arc(
        0,-28,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        -6,-30,
        4,8,
        -0.3,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        6,-30,
        4,8,
        0.3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle="#173fa5";

    ctx.fillRect(
        -15,-12,
        30,38
    );


    /* chest */

    ctx.fillStyle="#d92828";

    ctx.fillRect(
        -15,-12,
        30,14
    );


    /* legs */

    ctx.fillStyle="#173fa5";

    ctx.fillRect(
        -13,26,
        10,28
    );

    ctx.fillRect(
        3,26,
        10,28
    );


    /* arms */

    ctx.fillStyle="#d92828";

    ctx.fillRect(
        -32,-8,
        18,10
    );

    ctx.fillRect(
        14,-8,
        18,10
    );

    ctx.restore();
}


/* GAME LOOP */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();


/* TRY LANDSCAPE LOCK */

async function lockLandscape(){

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){
            await screen.orientation.lock(
                "landscape"
            );
        }

    }catch(e){

        /* Browser may not allow automatic lock.
           Rotate message still handles portrait. */

    }
}

document.addEventListener(
    "click",
    lockLandscape,
    {once:true}
);

</script>

</body>
</html>
