<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ANMOL WEB MASTER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071326;
    font-family:Arial,sans-serif;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* HUD */
#hud{
    position:fixed;
    z-index:10;
    top:8px;
    left:8px;
    right:8px;

    min-height:58px;
    padding:8px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    background:rgba(0,0,0,.88);
    border-radius:15px;

    pointer-events:none;
}

.logo{
    color:#ff3030;
    font-size:25px;
    font-weight:900;
    white-space:nowrap;
    text-shadow:0 0 8px #ff0000;
}

.stats{
    display:flex;
    align-items:center;
    gap:18px;

    color:white;
    font-size:18px;
    font-weight:bold;
    white-space:nowrap;
}

.health{
    color:#ff4040;
}

.score{
    color:#ffd21c;
}

.high{
    color:#58ff58;
}

.enemyCount{
    color:#d78cff;
}

/* MOBILE CONTROLS */
#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:20px;

    width:110px;
    height:110px;

    border:3px solid rgba(255,255,255,.5);
    border-radius:50%;

    background:rgba(255,255,255,.10);

    pointer-events:auto;
}

#stick{
    position:absolute;

    width:52px;
    height:52px;

    left:26px;
    top:26px;

    border-radius:50%;

    background:rgba(220,225,235,.8);
}

.mobileBtn{
    position:absolute;

    width:72px;
    height:72px;

    border-radius:50%;

    border:3px solid white;

    color:white;
    font-weight:900;
    font-size:12px;

    pointer-events:auto;
}

#jumpBtn{
    right:20px;
    bottom:180px;
    background:#c5222b;
}

#attackBtn{
    right:105px;
    bottom:20px;
    background:#c5222b;
}

#webBtn{
    right:20px;
    bottom:20px;
    background:#2857c9;
}

/* GAME OVER */
#gameOver{
    display:none;

    position:fixed;
    inset:0;
    z-index:50;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.88);

    color:white;
    text-align:center;
}

.gameOverBox{
    width:min(90%,420px);

    padding:30px;

    border:2px solid #00cfff;
    border-radius:20px;

    background:#101827;

    box-shadow:0 0 30px #008cff;
}

.gameOverBox h1{
    color:#ff3030;
    font-size:42px;
    margin-bottom:15px;
}

.gameOverBox p{
    font-size:20px;
    margin:10px;
}

#restart{
    margin-top:18px;

    padding:13px 28px;

    border:0;
    border-radius:12px;

    background:#00bfff;

    color:white;

    font-size:18px;
    font-weight:bold;
}

/* ROTATE MESSAGE */
#rotateMessage{
    display:none;

    position:fixed;
    inset:0;
    z-index:100;

    background:#050505;
    color:white;

    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:24px;
    font-weight:bold;
}

@media (max-width:800px) and (orientation:landscape){

    #mobileControls{
        display:block;
    }

    #hud{
        top:5px;
        left:7px;
        right:7px;

        min-height:50px;

        padding:6px 10px;

        border-radius:12px;
    }

    .logo{
        font-size:18px;
    }

    .stats{
        font-size:14px;
        gap:9px;
    }

    #joystick{
        width:100px;
        height:100px;

        left:15px;
        bottom:15px;
    }

    #stick{
        width:48px;
        height:48px;

        left:23px;
        top:23px;
    }

    .mobileBtn{
        width:66px;
        height:66px;
        font-size:11px;
    }

    #jumpBtn{
        right:18px;
        bottom:165px;
    }

    #attackBtn{
        right:96px;
        bottom:18px;
    }

    #webBtn{
        right:18px;
        bottom:18px;
    }
}

@media (max-width:800px) and (orientation:portrait){

    #rotateMessage{
        display:flex;
    }

    #hud,
    #mobileControls{
        display:none;
    }
}

@media (max-height:430px) and (orientation:landscape){

    #hud{
        min-height:43px;
        padding:4px 8px;
    }

    .logo{
        font-size:15px;
    }

    .stats{
        font-size:11px;
        gap:6px;
    }

    #joystick{
        width:82px;
        height:82px;

        left:10px;
        bottom:8px;
    }

    #stick{
        width:40px;
        height:40px;

        left:18px;
        top:18px;
    }

    .mobileBtn{
        width:55px;
        height:55px;
        font-size:9px;
    }

    #jumpBtn{
        right:10px;
        bottom:115px;
    }

    #attackBtn{
        right:75px;
        bottom:8px;
    }

    #webBtn{
        right:10px;
        bottom:8px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="logo">
        ANMOL WEB MASTER
    </div>

    <div class="stats">

        <span class="health">
            ❤️ <span id="healthText">100</span>
        </span>

        <span class="score">
            ⭐ Score: <span id="scoreText">0</span>
        </span>

        <span class="high">
            🏆 High: <span id="highScoreText">0</span>
        </span>

        <span class="enemyCount">
            👾 <span id="enemyText">0</span>
        </span>

    </div>

</div>


<!-- MOBILE -->
<div id="mobileControls">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button class="mobileBtn" id="jumpBtn">
        JUMP
    </button>

    <button class="mobileBtn" id="attackBtn">
        ATTACK
    </button>

    <button class="mobileBtn" id="webBtn">
        WEB
    </button>

</div>


<!-- GAME OVER -->
<div id="gameOver">

    <div class="gameOverBox">

        <h1>GAME OVER</h1>

        <p>
            ⭐ Your Score:
            <span id="finalScore">0</span>
        </p>

        <p>
            🏆 High Score:
            <span id="finalHighScore">0</span>
        </p>

        <p>
            Better Luck Next Time! 💪
        </p>

        <button id="restart">
            PLAY AGAIN
        </button>

    </div>

</div>


<!-- ROTATE -->
<div id="rotateMessage">

    📱<br><br>

    Please rotate your phone to<br>

    <b>LANDSCAPE MODE</b>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
    Math.min(window.devicePixelRatio || 1,2);

    canvas.width =
    Math.floor(W*dpr);

    canvas.height =
    Math.floor(H*dpr);

    canvas.style.width =
    W+"px";

    canvas.style.height =
    H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
"resize",
resize
);

window.addEventListener(
"orientationchange",
()=>{
    setTimeout(resize,200);
});

resize();


/* =========================
   VARIABLES
========================= */

let player;

let enemies=[];
let webs=[];
let attacks=[];
let particles=[];

let score=0;
let kills=0;

let highScore =
Number(
localStorage.getItem(
"anmolWebMasterHighScore"
)
)||0;

let gameRunning=true;

let spawnTimer=0;

const MAX_ENEMIES=1000;


/* =========================
   PLAYER
========================= */

function createPlayer(){

    player={

        x:W/2,

        y:H-170,

        width:42,
        height:65,

        vx:0,
        vy:0,

        speed:5,

        health:100,

        grounded:true,

        direction:1,

        attackCooldown:0,
        webCooldown:0
    };
}

createPlayer();


/* =========================
   KEYBOARD
========================= */

const keys={};

window.addEventListener(
"keydown",
e=>{

    keys[
        e.key.toLowerCase()
    ]=true;

    if(e.code==="Space"){

        e.preventDefault();
        jump();
    }

    if(e.key.toLowerCase()==="w")
        jump();

    if(e.key.toLowerCase()==="f")
        attack();

    if(e.key.toLowerCase()==="e")
        shootWeb();
});


window.addEventListener(
"keyup",
e=>{

    keys[
        e.key.toLowerCase()
    ]=false;
});


/* =========================
   MOUSE
========================= */

window.addEventListener(
"mousedown",
e=>{

    if(!gameRunning)
        return;

    if(e.button===0)
        attack();

    if(e.button===2)
        shootWeb();
});


window.addEventListener(
"contextmenu",
e=>{
    e.preventDefault();
});


/* =========================
   SCORE
========================= */

function addScore(){

    score++;
    kills++;

    if(score>highScore){

        highScore=score;

        localStorage.setItem(
            "anmolWebMasterHighScore",
            highScore
        );
    }
}


/* =========================
   DAMAGE
========================= */

function enemyDamage(){

    return score>=30 ? 30 : 10;
}


/* =========================
   SPAWN
========================= */

function spawnEnemy(){

    if(
        enemies.length>=MAX_ENEMIES
    )
        return;

    const side =
    Math.random()<.5
    ? -1
    : 1;

    enemies.push({

        x:
        side===-1
        ? -60
        : W+60,

        y:H-160,

        width:40,
        height:55,

        speed:
        1+
        Math.random()*1.5+
        (score>=30?1.5:0),

        health:1,

        hitCooldown:0
    });
}


/* =========================
   PARTICLES
========================= */

function createParticles(x,y){

    for(
        let i=0;
        i<10;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
            (Math.random()-.5)*7,

            vy:
            (Math.random()-.5)*7,

            life:30
        });
    }
}


/* =========================
   JUMP
========================= */

function jump(){

    if(
        !gameRunning
    )
        return;

    if(
        player.grounded
    ){

        player.vy=-12;

        player.grounded=false;
    }
}


/* =========================
   ATTACK
========================= */

function attack(){

    if(
        !gameRunning ||
        player.attackCooldown>0
    )
        return;

    player.attackCooldown=15;

    attacks.push({

        x:
        player.x+
        player.direction*30,

        y:
        player.y-25,

        width:70,
        height:45,

        life:10
    });
}


/* =========================
   WEB
========================= */

function shootWeb(){

    if(
        !gameRunning ||
        player.webCooldown>0
    )
        return;

    player.webCooldown=20;

    webs.push({

        x:player.x+20,

        y:player.y+10,

        vx:
        player.direction*11,

        life:70
    });
}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    return(

        a.x <
        b.x+b.width &&

        a.x+a.width >
        b.x &&

        a.y <
        b.y+b.height &&

        a.y+a.height >
        b.y
    );
}


/* =========================
   UPDATE
========================= */

function update(){

    if(!gameRunning)
        return;


    /* PLAYER MOVEMENT */

    player.vx=0;


    if(
        keys["a"]||
        keys["arrowleft"]
    ){

        player.vx=-player.speed;
        player.direction=-1;
    }


    if(
        keys["d"]||
        keys["arrowright"]
    ){

        player.vx=player.speed;
        player.direction=1;
    }


    player.x+=player.vx;

    player.vy+=.55;

    player.y+=player.vy;


    const ground=
    H-160;


    if(
        player.y>=ground
    ){

        player.y=ground;

        player.vy=0;

        player.grounded=true;
    }


    if(player.x<5)
        player.x=5;


    if(
        player.x>
        W-player.width-5
    )
        player.x=
        W-player.width-5;


    if(
        player.attackCooldown>0
    )
        player.attackCooldown--;


    if(
        player.webCooldown>0
    )
        player.webCooldown--;


    /* SPAWN */

    spawnTimer--;


    if(score>=30){

        if(
            spawnTimer<=0
        ){

            const amount=
            Math.min(
                8,
                MAX_ENEMIES-
                enemies.length
            );

            for(
                let i=0;
                i<amount;
                i++
            ){
                spawnEnemy();
            }

            spawnTimer=12;
        }

    }else{

        if(
            spawnTimer<=0
        ){

            spawnEnemy();

            spawnTimer=70;
        }
    }


    /* ENEMIES */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy=
        enemies[i];


        if(
            enemy.hitCooldown>0
        )
            enemy.hitCooldown--;


        /* CHASE */

        if(
            enemy.x<player.x
        )
            enemy.x+=enemy.speed;
        else
            enemy.x-=enemy.speed;


        /* PLAYER DAMAGE */

        if(
            collision(

                enemy,

                player
            )
        ){

            if(
                enemy.hitCooldown<=0
            ){

                player.health-=
                enemyDamage();

                enemy.hitCooldown=45;

                createParticles(
                    player.x+20,
                    player.y+20
                );


                if(
                    player.health<=0
                ){

                    player.health=0;

                    endGame();
                }
            }
        }


        /* ATTACK */

        for(
            let j=attacks.length-1;
            j>=0;
            j--
        ){

            const a=attacks[j];

            if(
                a.life>0 &&
                collision(a,enemy)
            ){

                enemy.health--;

                a.life=0;

                createParticles(
                    enemy.x+20,
                    enemy.y+20
                );


                if(
                    enemy.health<=0
                ){

                    enemies.splice(i,1);

                    addScore();

                    break;
                }
            }
        }


        /* WEB */

        for(
            let j=webs.length-1;
            j>=0;
            j--
        ){

            const web=webs[j];

            const box={

                x:web.x-7,
                y:web.y-7,

                width:14,
                height:14
            };


            if(
                web.life>0 &&
                collision(box,enemy)
            ){

                enemy.speed*=.2;

                web.life=0;
            }
        }
    }


    /* WEBS */

    for(
        let i=webs.length-1;
        i>=0;
        i--
    ){

        const web=webs[i];

        web.x+=web.vx;

        web.life--;


        if(
            web.life<=0 ||
            web.x<-100 ||
            web.x>W+100
        ){

            webs.splice(i,1);
        }
    }


    /* ATTACKS */

    for(
        let i=attacks.length-1;
        i>=0;
        i--
    ){

        attacks[i].life--;

        if(
            attacks[i].life<=0
        )
            attacks.splice(i,1);
    }


    /* PARTICLES */

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.2;

        p.life--;

        if(p.life<=0)
            particles.splice(i,1);
    }


    /* HUD */

    document.getElementById(
        "healthText"
    ).textContent=player.health;

    document.getElementById(
        "scoreText"
    ).textContent=score;

    document.getElementById(
        "highScoreText"
    ).textContent=highScore;

    document.getElementById(
        "enemyText"
    ).textContent=enemies.length;
}


/* =========================
   CITY
========================= */

function drawCity(){

    /* SKY */

    ctx.fillStyle="#0b1b35";

    ctx.fillRect(
        0,0,W,H
    );


    /* MOON */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        W-100,
        100,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* STARS */

    ctx.fillStyle="rgba(255,255,255,.8)";

    for(
        let i=0;
        i<70;
        i++
    ){

        const x=
        (i*173)%W;

        const y=
        70+
        (i*71)%
        Math.max(100,H*.5);

        ctx.fillRect(
            x,y,2,2
        );
    }


    /* BUILDINGS */

    const bw=105;


    for(
        let x=0;
        x<W+bw;
        x+=bw
    ){

        const buildingHeight=
        170+
        ((x*13)%190);


        ctx.fillStyle=
        x%210===0
        ? "#142541"
        : "#101d34";


        ctx.fillRect(

            x,

            H-160-
            buildingHeight,

            bw-7,

            buildingHeight
        );


        /* WINDOWS */

        ctx.fillStyle="#ffd84d";


        for(
            let wy=
            H-160-
            buildingHeight+
            25;

            wy<
            H-180;

            wy+=42
        ){

            for(
                let wx=x+16;

                wx<
                x+bw-20;

                wx+=28
            ){

                /* STABLE WINDOWS */

                const light=
                Math.abs(
                    Math.sin(
                        x*.013+
                        wy*.027+
                        wx
                    )
                )>.42;


                if(light){

                    ctx.fillRect(
                        wx,
                        wy,
                        10,
                        16
                    );
                }
            }
        }
    }


    /* GROUND */

    ctx.fillStyle="#20252b";

    ctx.fillRect(
        0,
        H-160,
        W,
        160
    );


    /* ROAD */

    ctx.fillStyle="#30343a";

    ctx.fillRect(
        0,
        H-95,
        W,
        95
    );


    /* ROAD LINE */

    ctx.strokeStyle="#eeeeee";

    ctx.lineWidth=4;

    ctx.setLineDash([
        35,25
    ]);

    ctx.beginPath();

    ctx.moveTo(
        0,
        H-47
    );

    ctx.lineTo(
        W,
        H-47
    );

    ctx.stroke();

    ctx.setLineDash([]);
}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(){

    const x=player.x;
    const y=player.y;


    /* SHADOW */

    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        x+21,
        H-150,
        28,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* BODY */

    ctx.fillStyle="#1769d8";

    ctx.fillRect(
        x+7,
        y+15,
        28,
        35
    );


    /* HEAD */

    ctx.fillStyle="#c9936e";

    ctx.beginPath();

    ctx.arc(
        x+21,
        y+8,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* MASK */

    ctx.fillStyle="#c71930";

    ctx.beginPath();

    ctx.arc(
        x+21,
        y+8,
        16,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* EYES */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        x+15,
        y+6,
        4,
        7,
        -.3,
        0,
        Math.PI*2
    );

    ctx.ellipse(
        x+27,
        y+6,
        4,
        7,
        .3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* SPIDER */

    ctx.strokeStyle="white";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        x+21,y+22
    );

    ctx.lineTo(
        x+21,y+40
    );

    ctx.moveTo(
        x+21,y+25
    );

    ctx.lineTo(
        x+12,y+30
    );

    ctx.moveTo(
        x+21,y+25
    );

    ctx.lineTo(
        x+30,y+30
    );

    ctx.moveTo(
        x+21,y+31
    );

    ctx.lineTo(
        x+11,y+37
    );

    ctx.moveTo(
        x+21,y+31
    );

    ctx.lineTo(
        x+31,y+37
    );

    ctx.stroke();


    /* LEGS */

    ctx.strokeStyle="#1769d8";

    ctx.lineWidth=7;

    ctx.beginPath();

    ctx.moveTo(
        x+14,y+49
    );

    ctx.lineTo(
        x+9,y+64
    );

    ctx.moveTo(
        x+28,y+49
    );

    ctx.lineTo(
        x+34,y+64
    );

    ctx.stroke();
}


/* =========================
   ENEMIES DRAW
========================= */

function drawEnemies(){

    enemies.forEach(enemy=>{

        const x=enemy.x;
        const y=enemy.y;


        ctx.fillStyle="#8f2028";

        ctx.fillRect(
            x+5,
            y+15,
            30,
            35
        );


        ctx.fillStyle="#c7333c";

        ctx.beginPath();

        ctx.arc(
            x+20,
            y+8,
            15,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#ffff00";

        ctx.beginPath();

        ctx.arc(
            x+14,
            y+7,
            3,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+26,
            y+7,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#8f2028";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
            x+14,y+48
        );

        ctx.lineTo(
            x+8,y+63
        );

        ctx.moveTo(
            x+27,y+48
        );

        ctx.lineTo(
            x+34,y+63
        );

        ctx.stroke();
    });
}


/* =========================
   WEBS DRAW
========================= */

function drawWebs(){

    webs.forEach(web=>{

        ctx.strokeStyle="white";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            player.x+20,
            player.y+10
        );

        ctx.lineTo(
            web.x,
            web.y
        );

        ctx.stroke();


        ctx.fillStyle="white";

        ctx.beginPath();

        ctx.arc(
            web.x,
            web.y,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}


/* =========================
   ATTACK DRAW
========================= */

function drawAttacks(){

    attacks.forEach(a=>{

        ctx.strokeStyle="#00d9ff";

        ctx.lineWidth=7;

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y+20
        );

        ctx.lineTo(
            a.x+45,
            a.y+5
        );

        ctx.stroke();
    });
}


/* =========================
   PARTICLES
========================= */

function drawParticles(){

    particles.forEach(p=>{

        ctx.fillStyle="#00d9ff";

        ctx.fillRect(
            p.x,
            p.y,
            4,
            4
        );
    });
}


/* =========================
   DRAW
========================= */

function draw(){

    drawCity();

    drawWebs();

    drawEnemies();

    drawAttacks();

    drawParticles();

    drawPlayer();
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}

gameLoop();


/* =========================
   GAME OVER
========================= */

function endGame(){

    gameRunning=false;

    document.getElementById(
        "finalScore"
    ).textContent=score;

    document.getElementById(
        "finalHighScore"
    ).textContent=highScore;

    document.getElementById(
        "gameOver"
    ).style.display="flex";
}

document.getElementById(
"restart"

()=>{

    kills=0;

/* =========================
   JOYSTICK
========================= */

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

let joystickActive=false;


function joystickMove(
    clientX,
    clientY
){

    const rect=
    joystick.getBoundingClientRect();


    let dx=
    clientX-
    (
        rect.left+
        rect.width/2
    );


    let dy=
    clientY-
    (
        rect.top+
        rect.height/2
    );


    const max=38;


    const distance=
    Math.sqrt(
        dx*dx+
        dy*dy
    );


    if(
        distance>max
    ){

        dx=
        dx/distance*max;

        dy=
        dy/distance*max;
    }


    stick.style.transform=
    `translate(${dx}px,${dy}px)`;


    if(dx<-10){

        keys["a"]=true;
        keys["d"]=false;

    }else if(dx>10){

        keys["d"]=true;
        keys["a"]=false;

    }else{

        keys["a"]=false;
        keys["d"]=false;
    }
}


joystick.addEventListener(
"touchstart",
e=>{

    e.preventDefault();

    joystickActive=true;

    const t=e.touches[0];

    joystickMove(
        t.clientX,
        t.clientY
    );

},
{passive:false}
);


joystick.addEventListener(
"touchmove",
e=>{

    e.preventDefault();

    if(!joystickActive)
        return;

    const t=e.touches[0];

    joystickMove(
        t.clientX,
        t.clientY
    );

},
{passive:false}
);


joystick.addEventListener(
"touchend",
e=>{

    e.preventDefault();

    joystickActive=false;

    keys["a"]=false;
    keys["d"]=false;

    stick.style.transform=
    "translate(0,0)";

},
{passive:false}
);


/* STOP PHONE SCROLL */

document.addEventListener(
"touchmove",
e=>{
    e.preventDefault();
},
{passive:false}
);

</script>
