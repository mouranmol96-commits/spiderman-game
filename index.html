<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ANMOL WEB MASTER 3D V2</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05080d;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:14px;
    left:14px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.55);
    border:1px solid #00eaff;
    border-radius:12px;
    padding:11px 15px;
    line-height:1.65;
    font-weight:bold;
    text-shadow:0 0 8px #00eaff;
}

#title{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#00eaff;
    font-size:23px;
    font-weight:900;
    text-shadow:0 0 15px #00eaff;
    white-space:nowrap;
}

#mission{
    position:fixed;
    top:60px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#fff;
    background:rgba(0,0,0,.5);
    padding:7px 13px;
    border-radius:9px;
    font-size:14px;
}

#crosshair{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:15;
    color:#fff;
    font-size:27px;
    pointer-events:none;
    text-shadow:0 0 8px #fff;
}

#instructions{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    color:#ddd;
    background:rgba(0,0,0,.5);
    padding:6px 10px;
    border-radius:7px;
    font-size:12px;
}

#mobileMove{
    position:fixed;
    left:12px;
    bottom:18px;
    z-index:30;
}

.moveRow{
    display:flex;
    justify-content:center;
}

button{
    touch-action:none;
    -webkit-tap-highlight-color:transparent;
}

.moveBtn{
    width:58px;
    height:58px;
    margin:3px;
    border-radius:50%;
    border:2px solid #00eaff;
    background:rgba(0,20,35,.75);
    color:white;
    font-size:22px;
    font-weight:bold;
}

#actions{
    position:fixed;
    right:12px;
    bottom:18px;
    z-index:30;
    display:flex;
    flex-direction:column;
}

.actionBtn{
    width:78px;
    height:58px;
    margin:3px;
    border-radius:13px;
    background:rgba(0,20,35,.8);
    color:white;
    font-weight:bold;
    border:2px solid white;
}

#attackBtn{
    border-color:#ff304f;
}

#webBtn{
    border-color:#00eaff;
}

#jumpBtn{
    border-color:#ffe000;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.9);
    color:white;
    text-align:center;
    padding-top:25vh;
}

#gameOver h1{
    font-size:48px;
    color:#ff304f;
    text-shadow:0 0 20px red;
}

#gameOver p{
    font-size:22px;
    margin:15px;
}

#restart{
    padding:14px 30px;
    border:0;
    border-radius:10px;
    background:#008cff;
    color:white;
    font-size:20px;
    font-weight:bold;
}

@media(max-width:700px){
    #title{
        font-size:17px;
    }

    #instructions{
        display:none;
    }

    #mission{
        top:52px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<div id="title">🕸️ ANMOL WEB MASTER 3D V2</div>

<div id="hud">
❤️ Health: <span id="health">100</span><br>
⭐ Score: <span id="score">0</span><br>
👾 Enemies: <span id="enemyCount">8</span>
</div>

<div id="mission">
🎯 Mission: Defeat all enemies
</div>

<div id="crosshair">+</div>

<div id="instructions">
WASD Move • Mouse Turn • SPACE Jump • F Attack • E Web
</div>

<div id="mobileMove">

    <div class="moveRow">
        <button class="moveBtn" id="up">▲</button>
    </div>

    <div class="moveRow">
        <button class="moveBtn" id="left">◀</button>
        <button class="moveBtn" id="down">▼</button>
        <button class="moveBtn" id="right">▶</button>
    </div>

</div>

<div id="actions">
    <button class="actionBtn" id="jumpBtn">JUMP</button>
    <button class="actionBtn" id="attackBtn">👊 ATTACK</button>
    <button class="actionBtn" id="webBtn">🕸️ WEB</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restart">PLAY AGAIN</button>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   ANMOL WEB MASTER 3D V2
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07111e);

scene.fog = new THREE.Fog(
    0x07111e,
    45,
    260
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
    68,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,5,10);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

renderer.outputEncoding=
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
   ========================================================= */

const hemi =
new THREE.HemisphereLight(
    0x8ad8ff,
    0x111111,
    1.6
);

scene.add(hemi);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sun.position.set(
    60,
    100,
    40
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;

scene.add(sun);


/* =========================================================
   MOON / SKY LIGHT
   ========================================================= */

const moon =
new THREE.PointLight(
    0x168cff,
    2,
    150
);

moon.position.set(
    0,
    50,
    -50
);

scene.add(moon);


/* =========================================================
   GROUND
   ========================================================= */

const ground =
new THREE.Mesh(
    new THREE.PlaneGeometry(
        600,
        600
    ),
    new THREE.MeshStandardMaterial({
        color:0x1d2229,
        roughness:.95
    })
);

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   ROADS
   ========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            .12,
            depth
        ),
        new THREE.MeshStandardMaterial({
            color:0x0d1014
        })
    );

    road.position.set(
        x,
        .06,
        z
    );

    road.receiveShadow=true;

    scene.add(road);


    for(
        let i=-width/2;
        i<width/2;
        i+=8
    ){

        const line =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                .025,
                .22
            ),
            new THREE.MeshBasicMaterial({
                color:0xffdd00
            })
        );

        line.position.set(
            x+i,
            .13,
            z
        );

        scene.add(line);
    }
}


createRoad(0,0,600,18);
createRoad(0,55,600,16);
createRoad(0,-55,600,16);


/* =========================================================
   BUILDINGS
   ========================================================= */

const buildings=[];

function createBuilding(
    x,
    z,
    width,
    height,
    depth
){

    const materials=[
        0x26394f,
        0x34485e,
        0x1d2b3a,
        0x213c57,
        0x34383d
    ];

    const material=
    new THREE.MeshStandardMaterial({
        color:
        materials[
            Math.floor(
                Math.random()*
                materials.length
            )
        ],
        roughness:.75
    });


    const building =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        material
    );

    building.position.set(
        x,
        height/2,
        z
    );

    building.castShadow=true;
    building.receiveShadow=true;

    scene.add(building);

    buildings.push(building);


    /* WINDOWS */

    for(
        let y=4;
        y<height-2;
        y+=4
    ){

        for(
            let xx=-width/2+2;
            xx<width/2-1;
            xx+=4
        ){

            const windowMat =
            new THREE.MeshBasicMaterial({
                color:
                Math.random()>.3
                ?0x00d9ff
                :0x11151a
            });


            const window =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.35,
                    1.3,
                    .08
                ),
                windowMat
            );

            window.position.set(
                x+xx,
                y,
                z-depth/2-.05
            );

            scene.add(window);
        }
    }
}


/* CITY BLOCKS */

for(
    let x=-120;
    x<=120;
    x+=25
){

    if(Math.abs(x)<15)
        continue;

    createBuilding(
        x,
        -32,
        18,
        18+
        Math.random()*48,
        18
    );

    createBuilding(
        x,
        32,
        18,
        18+
        Math.random()*48,
        18
    );
}


/* =========================================================
   STREET LIGHTS
   ========================================================= */

function streetLight(x,z){

    const pole =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .08,
            .08,
            5,
            10
        ),
        new THREE.MeshStandardMaterial({
            color:0x444444
        })
    );

    pole.position.set(
        x,
        2.5,
        z
    );

    pole.castShadow=true;

    scene.add(pole);


    const lamp =
    new THREE.PointLight(
        0x00cfff,
        1.4,
        15
    );

    lamp.position.set(
        x,
        5,
        z
    );

    scene.add(lamp);
}


for(
    let z=-100;
    z<=100;
    z+=20
){

    streetLight(-7,z);
    streetLight(7,z);
}


/* =========================================================
   PLAYER
   ========================================================= */

const player =
new THREE.Group();

scene.add(player);

player.position.set(
    0,
    0,
    12
);


/* materials */

const blueMat =
new THREE.MeshStandardMaterial({
    color:0x1268ff,
    roughness:.5
});

const redMat =
new THREE.MeshStandardMaterial({
    color:0xe3262e,
    roughness:.5
});

const blackMat =
new THREE.MeshStandardMaterial({
    color:0x101010,
    roughness:.7
});

const whiteMat =
new THREE.MeshStandardMaterial({
    color:0xffffff
});


/* BODY */

const torso =
new THREE.Mesh(
    new THREE.CapsuleGeometry(
        .62,
        1.35,
        8,
        16
    ),
    blueMat
);

torso.position.y=2.05;
torso.castShadow=true;

player.add(torso);


/* HEAD */

const head =
new THREE.Mesh(
    new THREE.SphereGeometry(
        .64,
        32,
        24
    ),
    redMat
);

head.position.y=3.72;

head.castShadow=true;

player.add(head);


/* EYES */

const eyeGeometry =
new THREE.SphereGeometry(
    .18,
    16,
    12
);

const eyeL =
new THREE.Mesh(
    eyeGeometry,
    whiteMat
);

const eyeR =
eyeL.clone();

eyeL.position.set(
    -.23,
    3.8,
    .58
);

eyeR.position.set(
    .23,
    3.8,
    .58
);

player.add(eyeL);
player.add(eyeR);


/* ARMS */

function createArm(x){

    const arm =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .21,
            1.25,
            7,
            14
        ),
        blueMat
    );

    arm.position.set(
        x,
        2.1,
        0
    );

    arm.castShadow=true;

    player.add(arm);

    return arm;
}

const armLeft=
createArm(-.9);

const armRight=
createArm(.9);


/* LEGS */

function createLeg(x){

    const leg =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .25,
            1.25,
            7,
            14
        ),
        blackMat
    );

    leg.position.set(
        x,
        .65,
        0
    );

    leg.castShadow=true;

    player.add(leg);

    return leg;
}

const legLeft=
createLeg(-.35);

const legRight=
createLeg(.35);


/* =========================================================
   ENEMIES
   ========================================================= */

const enemyList=[];

function createEnemy(x,z){

    const enemy =
    new THREE.Group();


    const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .58,
            1.25,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0xff2525,
            roughness:.55
        })
    );

    body.position.y=1.8;

    body.castShadow=true;

    enemy.add(body);


    const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .57,
            24,
            20
        ),
        new THREE.MeshStandardMaterial({
            color:0x202020
        })
    );

    head.position.y=3.35;

    head.castShadow=true;

    enemy.add(head);


    /* enemy eyes */

    const eEyeMat =
    new THREE.MeshBasicMaterial({
        color:0xff0000
    });

    const e1 =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .08,8,8
        ),
        eEyeMat
    );

    const e2=e1.clone();

    e1.position.set(
        -.18,
        3.4,
        .52
    );

    e2.position.set(
        .18,
        3.4,
        .52
    );

    enemy.add(e1);
    enemy.add(e2);


    enemy.position.set(
        x,
        0,
        z
    );

    scene.add(enemy);


    enemyList.push({
        object:enemy,
        hp:3,
        speed:
            .018+
            Math.random()*.014,
        alive:true,
        hitCooldown:0
    });
}


/* create enemies */

createEnemy(-20,4);
createEnemy(20,4);
createEnemy(-30,-18);
createEnemy(30,-18);
createEnemy(-12,-42);
createEnemy(12,-42);
createEnemy(-42,15);
createEnemy(42,15);


/* =========================================================
   GAME STATE
   ========================================================= */

let health=100;
let score=0;

let velocityY=0;

let grounded=true;

let gameRunning=true;

let webLine=null;

let webTarget=null;

let swingTimer=0;

const keys={
    forward:false,
    backward:false,
    left:false,
    right:false
};


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.code==="KeyW")
            keys.forward=true;

        if(e.code==="KeyS")
            keys.backward=true;

        if(e.code==="KeyA")
            keys.left=true;

        if(e.code==="KeyD")
            keys.right=true;


        if(e.code==="Space"){

            e.preventDefault();

            jump();
        }


        if(e.code==="KeyF")
            attack();


        if(e.code==="KeyE")
            webShoot();
    }
);


document.addEventListener(
    "keyup",
    function(e){

        if(e.code==="KeyW")
            keys.forward=false;

        if(e.code==="KeyS")
            keys.backward=false;

        if(e.code==="KeyA")
            keys.left=false;

        if(e.code==="KeyD")
            keys.right=false;
    }
);


/* =========================================================
   MOBILE BUTTONS
   ========================================================= */

function holdButton(
    id,
    property
){

    const button=
    document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[property]=true;
        }
    );


    button.addEventListener(
        "pointerup",
        function(){

            keys[property]=false;
        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[property]=false;
        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[property]=false;
        }
    );
}


holdButton(
    "up",
    "forward"
);

holdButton(
    "down",
    "backward"
);

holdButton(
    "left",
    "left"
);

holdButton(
    "right",
    "right"
);


document.getElementById(
    "jumpBtn"
).addEventListener(
    "pointerdown",
    jump
);


document.getElementById(
    "attackBtn"
).addEventListener(
    "pointerdown",
    attack
);


document.getElementById(
    "webBtn"
).addEventListener(
    "pointerdown",
    webShoot
);


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

    if(!gameRunning)
        return;

    if(grounded){

        velocityY=.29;

        grounded=false;
    }
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

function updatePlayer(){

    if(!gameRunning)
        return;


    const moveSpeed=.20;

    const turnSpeed=.045;


    /* TURN */

    if(keys.left)
        player.rotation.y += turnSpeed;

    if(keys.right)
        player.rotation.y -= turnSpeed;


    /* MOVE */

    if(keys.forward){

        player.translateZ(
            -moveSpeed
        );
    }


    if(keys.backward){

        player.translateZ(
            moveSpeed*.7
        );
    }


    /* walking animation */

    const moving =
        keys.forward ||
        keys.backward;

    if(moving){

        const t=
            Date.now()*.014;

        legLeft.rotation.x=
            Math.sin(t)*.55;

        legRight.rotation.x=
            -Math.sin(t)*.55;

        armLeft.rotation.x=
            -Math.sin(t)*.45;

        armRight.rotation.x=
            Math.sin(t)*.45;
    }
    else{

        legLeft.rotation.x*=.85;
        legRight.rotation.x*=.85;
        armLeft.rotation.x*=.85;
        armRight.rotation.x*=.85;
    }


    /* GRAVITY */

    velocityY-=.012;

    player.position.y+=
        velocityY;


    if(player.position.y<=0){

        player.position.y=0;

        velocityY=0;

        grounded=true;
    }


    /* WORLD LIMIT */

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -240,
            240
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -240,
            240
        );
}


/* =========================================================
   ATTACK
   ========================================================= */

function attack(){

    if(!gameRunning)
        return;


    armRight.rotation.x=-1.2;

    setTimeout(
        ()=>{
            armRight.rotation.x=0;
        },
        180
    );


    enemyList.forEach(
        enemy=>{

            if(!enemy.alive)
                return;


            const distance=
                player.position.distanceTo(
                    enemy.object.position
                );


            if(distance<5){

                enemy.hp--;

                enemy.object.position.y=.45;


                setTimeout(
                    ()=>{
                        if(enemy.alive)
                            enemy.object.position.y=0;
                    },
                    120
                );


                if(enemy.hp<=0){

                    enemy.alive=false;

                    scene.remove(
                        enemy.object
                    );

                    score+=100;

                    updateHUD();
                }
            }
        }
    );
}


/* =========================================================
   WEB SHOOTING
   ========================================================= */

function findWebTarget(){

    let best=null;
    let bestDistance=999;


    enemyList.forEach(
        enemy=>{

            if(!enemy.alive)
                return;


            const distance=
                player.position.distanceTo(
                    enemy.object.position
                );


            if(
                distance<55 &&
                distance<bestDistance
            ){

                best=enemy;
                bestDistance=distance;
            }
        }
    );


    return best;
}


function webShoot(){

    if(!gameRunning)
        return;


    if(webLine){

        scene.remove(webLine);

        webLine=null;
    }


    const target=
        findWebTarget();


    const start=
        player.position.clone();

    start.y+=3;


    let end;


    if(target){

        end=
            target.object
            .position.clone();

        end.y+=2;

        webTarget=target;
    }
    else{

        const direction=
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            player.quaternion
        );

        end=
            start.clone().add(
                direction.multiplyScalar(45)
            );

        webTarget=null;
    }


    const geometry=
        new THREE.BufferGeometry()
        .setFromPoints([
            start,
            end
        ]);


    const material=
        new THREE.LineBasicMaterial({
            color:0xffffff
        });


    webLine=
        new THREE.Line(
            geometry,
            material
        );


    scene.add(webLine);


    /* WEB PULL */

    if(target){

        const pull=
            player.position.clone()
            .sub(
                target.object.position
            )
            .normalize();


        player.position.x +=
            pull.x*-.8;

        player.position.z +=
            pull.z*-.8;

        score+=10;

        updateHUD();
    }
    else{

        /* forward web boost */

        const direction=
            new THREE.Vector3(
                0,
                0,
                -1
            );

        direction.applyQuaternion(
            player.quaternion
        );

        player.position.add(
            direction.multiplyScalar(4)
        );
    }


    swingTimer=25;
}


/* =========================================================
   WEB ANIMATION
   ========================================================= */

function updateWeb(){

    if(!webLine)
        return;


    if(webTarget &&
       webTarget.alive){

        const start=
            player.position.clone();

        start.y+=3;


        const end=
            webTarget.object
            .position.clone();

        end.y+=2;


        webLine.geometry
        .setFromPoints([
            start,
            end
        ]);
    }


    swingTimer--;


    if(swingTimer<=0){

        scene.remove(webLine);

        webLine=null;

        webTarget=null;
    }
}


/* =========================================================
   ENEMY AI
   ========================================================= */

function updateEnemies(){

    enemyList.forEach(
        enemy=>{

            if(!enemy.alive)
                return;


            const e=
                enemy.object;


            const distance=
                e.position.distanceTo(
                    player.position
                );


            if(distance<50){

                const dx=
                    player.position.x-
                    e.position.x;

                const dz=
                    player.position.z-
                    e.position.z;


                const angle=
                    Math.atan2(
                        dx,
                        dz
                    );


                e.rotation.y=
                    angle;


                if(distance>3){

                    e.position.x +=
                        Math.sin(angle)*
                        enemy.speed;

                    e.position.z +=
                        Math.cos(angle)*
                        enemy.speed;
                }


                if(distance<3){

                    health-=.12;

                    if(health<0)
                        health=0;

                    updateHUD();


                    if(health<=0)
                        endGame();
                }
            }
        }
    );
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

    const offset=
        new THREE.Vector3(
            0,
            5.4,
            10
        );


    offset.applyQuaternion(
        player.quaternion
    );


    const desired=
        player.position
        .clone()
        .add(offset);


    camera.position.lerp(
        desired,
        .10
    );


    const look=
        player.position
        .clone();


    look.y+=2.1;


    camera.lookAt(
        look
    );
}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

    document.getElementById(
        "health"
    ).textContent=
        Math.ceil(health);


    document.getElementById(
        "score"
    ).textContent=
        score;


    const alive=
        enemyList.filter(
            e=>e.alive
        ).length;


    document.getElementById(
        "enemyCount"
    ).textContent=
        alive;


    if(alive===0){

        document.getElementById(
            "mission"
        ).textContent=
            "🏆 MISSION COMPLETE!";
    }
}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

    if(!gameRunning)
        return;


    gameRunning=false;


    document.getElementById(
        "finalScore"
    ).textContent=
        score;


    document.getElementById(
        "gameOver"
    ).style.display=
        "block";
}


document.getElementById(
    "restart"
).onclick=
function(){

    location.reload();
};


/* =========================================================
   MOUSE TURN
   ========================================================= */

let mousePressed=false;
let previousMouseX=0;


renderer.addEventListener(
    "pointerdown",
    function(e){

        if(e.pointerType==="mouse"){

            mousePressed=true;

            previousMouseX=
                e.clientX;
        }
    }
);


window.addEventListener(
    "pointerup",
    function(){

        mousePressed=false;
    }
);


window.addEventListener(
    "pointermove",
    function(e){

        if(!mousePressed)
            return;

        if(e.pointerType!=="mouse")
            return;


        const difference=
            e.clientX-
            previousMouseX;


        player.rotation.y-=
            difference*.006;


        previousMouseX=
            e.clientX;
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   GAME LOOP
   ========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(gameRunning){

        updatePlayer();

        updateEnemies();

        updateCamera();

        updateWeb();
    }


    renderer.render(
        scene,
        camera
    );
}


updateHUD();

animate();

</script>
