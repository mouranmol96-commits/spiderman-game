<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Play Web Hero - City Swing, an exciting superhero web-swinging game with buildings, enemies, jumping and fighting.">

    <meta name="keywords"
          content="superhero game, web swinging game, Spider-Man style game, city game, online game, Web Hero">

    <!-- GOOGLE SEARCH CONSOLE VERIFICATION -->
    <meta name="google-site-verification"
          content="PASTE-YOUR-GOOGLE-CODE-HERE">

    <title>Web Hero - City Swing | Online Superhero Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07101c;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;

            display: flex;
            align-items: center;
            gap: 25px;

            padding: 12px 18px;

            color: white;
            background: rgba(0,0,0,.72);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 12px;

            pointer-events: none;
        }

        .logo {
            margin-right: auto;
            color: #ff3030;
            font-size: 24px;
            font-weight: 900;
        }

        .stat {
            font-size: 16px;
            font-weight: bold;
        }

        #controls {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;

            padding: 9px 18px;

            color: white;
            background: rgba(0,0,0,.7);
            border-radius: 10px;

            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
        }

        #message {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);

            z-index: 20;
            display: none;

            text-align: center;
            color: white;

            background: rgba(0,0,0,.9);
            padding: 35px;
            border-radius: 18px;
            border: 2px solid #333;
        }

        #message h1 {
            color: #ff3030;
            margin-bottom: 15px;
            font-size: 40px;
        }

        #message p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 25px;
            border: 0;
            border-radius: 9px;
            background: #ff3030;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="hud">
    <div class="logo">WEB HERO</div>

    <div class="stat">
        ❤️ <span id="health">100</span>
    </div>

    <div class="stat">
        ⭐ <span id="score">0</span>
    </div>

    <div class="stat">
        🕸️ <span id="webs">∞</span>
    </div>
</div>

<canvas id="game"></canvas>

<div id="controls">
    A / D = Run • W / SPACE = Jump • E = Shoot Web • R = Release Web
</div>

<div id="message">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button onclick="restart()">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}

resize();
addEventListener("resize", resize);

let score = 0;
let health = 100;
let running = true;
let cameraX = 0;

const gravity = 0.75;
const keys = {};

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp"
    ) {
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "e") {
        shootWeb();
    }

    if (e.key.toLowerCase() === "r") {
        releaseWeb();
    }
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

const player = {
    x: 300,
    y: 300,
    vx: 0,
    vy: 0,
    width: 34,
    height: 62,
    maxSpeed: 8,
    jumpPower: -14,
    grounded: false,
    web: null,
    swinging: false
};

const buildings = [];
const enemies = [];

function generateCity() {
    buildings.length = 0;

    let x = -500;

    while (x < 12000) {
        const width = 140 + Math.random() * 180;
        const height = 180 + Math.random() * 400;

        buildings.push({
            x: x,
            y: canvas.height - height,
            width: width,
            height: height
        });

        x += width + 20;
    }
}

generateCity();

function getGroundY(x) {
    for (const b of buildings) {
        if (x >= b.x && x <= b.x + b.width) {
            return b.y;
        }
    }

    return canvas.height;
}

function createEnemies() {
    enemies.length = 0;

    for (let i = 0; i < 18; i++) {
        enemies.push({
            x: 700 + i * 450 + Math.random() * 250,
            y: 0,
            width: 32,
            height: 48,
            vx: 1.2 + Math.random() * 1.5,
            alive: true
        });
    }
}

createEnemies();

function findWebAnchor() {
    let best = null;
    let bestDistance = 700;

    for (const b of buildings) {
        const anchorX = b.x + b.width / 2;
        const anchorY = b.y + 10;

        const distance = Math.hypot(
            anchorX - player.x,
            anchorY - player.y
        );

        if (
            distance < bestDistance &&
            anchorY < player.y
        ) {
            best = {
                x: anchorX,
                y: anchorY
            };

            bestDistance = distance;
        }
    }

    return best;
}

function shootWeb() {
    if (!running || player.web) return;

    const anchor = findWebAnchor();

    if (!anchor) return;

    player.web = anchor;
    player.swinging = true;
}

function releaseWeb() {
    player.web = null;
    player.swinging = false;
}

function updatePlayer() {
    if (!running) return;

    if (keys["a"] || keys["arrowleft"]) {
        player.vx -= 0.8;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.vx += 0.8;
    }

    player.vx *= 0.88;

    if (player.vx > player.maxSpeed)
        player.vx = player.maxSpeed;

    if (player.vx < -player.maxSpeed)
        player.vx = -player.maxSpeed;

    if (
        (keys["w"] ||
         keys["arrowup"] ||
         keys[" "]) &&
        player.grounded
    ) {
        player.vy = player.jumpPower;
        player.grounded = false;
    }

    if (player.swinging && player.web) {
        const dx = player.web.x - player.x;
        const dy = player.web.y - player.y;

        const distance = Math.hypot(dx, dy);

        if (distance > 80) {
            const force = (distance - 170) * 0.0025;

            player.vx += dx / distance * force;
            player.vy += dy / distance * force;
        }
    }

    player.vy += gravity;

    player.x += player.vx;
    player.y += player.vy;

    const ground = getGroundY(player.x);

    if (player.y + player.height / 2 >= ground) {
        player.y = ground - player.height / 2;
        player.vy = 0;
        player.grounded = true;
    } else {
        player.grounded = false;
    }

    if (player.y > canvas.height + 300) {
        health -= 20;
        player.x -= 200;
        player.y = 200;
        player.vy = 0;
    }

    if (player.x < 0)
        player.x = 0;
}

function updateEnemies() {
    for (const enemy of enemies) {
        if (!enemy.alive) continue;

        enemy.y =
            getGroundY(enemy.x) -
            enemy.height / 2;

        const distance = player.x - enemy.x;

        if (Math.abs(distance) < 500) {
            enemy.vx = distance > 0 ? 1.5 : -1.5;
            enemy.x += enemy.vx;
        }

        if (
            Math.abs(player.x - enemy.x) < 40 &&
            Math.abs(player.y - enemy.y) < 55
        ) {
            health -= 0.25;

            player.vx =
                player.x < enemy.x ? -7 : 7;

            player.vy = -7;
        }
    }
}

function updateCamera() {
    const target = player.x - canvas.width * 0.35;

    cameraX += (target - cameraX) * 0.08;

    if (cameraX < 0)
        cameraX = 0;
}

function drawSky() {
    const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        canvas.height
    );

    gradient.addColorStop(0, "#081b3a");
    gradient.addColorStop(1, "#16263d");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* moon */

    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 100,
        90,
        32,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

function drawCity() {
    for (const b of buildings) {
        const x = b.x - cameraX;

        if (
            x + b.width < 0 ||
            x > canvas.width
        ) continue;

        ctx.fillStyle = "#101827";

        ctx.fillRect(
            x,
            b.y,
            b.width,
            b.height
        );

        ctx.fillStyle = "#26354a";

        ctx.fillRect(
            x,
            b.y,
            b.width,
            8
        );

        for (
            let wx = x + 15;
            wx < x + b.width - 10;
            wx += 28
        ) {
            for (
                let wy = b.y + 25;
                wy < canvas.height - 30;
                wy += 35
            ) {
                ctx.fillStyle =
                    ((wx + wy) % 3 === 0)
                    ? "#ffd95a"
                    : "#30445c";

                ctx.fillRect(
                    wx,
                    wy,
                    12,
                    18
                );
            }
        }
    }
}

function drawPlayer() {
    const x = player.x - cameraX;
    const y = player.y;

    ctx.save();
    ctx.translate(x, y);

    /* head */

    ctx.fillStyle = "#c92525";

    ctx.beginPath();

    ctx.arc(
        0,
        -24,
        15,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* mask */

    ctx.fillStyle = "#a91616";

    ctx.fillRect(
        -14,
        -39,
        28,
        28
    );

    /* eyes */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.ellipse(
        -6,
        -28,
        4,
        8,
        -0.3,
        0,
        Math.PI * 2
    );

    ctx.ellipse(
        6,
        -28,
        4,
        8,
        0.3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* body */

    ctx.fillStyle = "#173b9e";

    ctx.fillRect(
        -14,
        -10,
        28,
        35
    );

    /* chest */

    ctx.fillStyle = "#c92525";

    ctx.fillRect(
        -14,
        -10,
        28,
        13
    );

    /* legs */

    ctx.fillStyle = "#173b9e";

    ctx.fillRect(
        -13,
        25,
        10,
        27
    );

    ctx.fillRect(
        3,
        25,
        10,
        27
    );

    /* arms */

    ctx.fillStyle = "#c92525";

    ctx.fillRect(
        -31,
        -7,
        18,
        9
    );

    ctx.fillRect(
        13,
        -7,
        18,
        9
    );

    ctx.restore();
}

function drawEnemies() {
    for (const enemy of enemies) {
        if (!enemy.alive) continue;

        const x = enemy.x - cameraX;
        const y = enemy.y;

        ctx.fillStyle = "#7b2cff";

        ctx.fillRect(
            x - 16,
            y - 24,
            32,
            48
        );

        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            x - 7,
            y - 10,
            4,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 7,
            y - 10,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function drawWeb() {
    if (!player.web) return;

    const x1 = player.x - cameraX;
    const y1 = player.y - 20;

    const x2 = player.web.x - cameraX;
    const y2 = player.web.y;

    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);

    ctx.stroke();
}

function updateHUD() {
    document.getElementById("health")
        .textContent =
        Math.max(0, Math.floor(health));

    document.getElementById("score")
        .textContent = score;
}

function gameOver() {
    running = false;

    document.getElementById("finalScore")
        .textContent = score;

    document.getElementById("message")
        .style.display = "block";
}

function restart() {
    score = 0;
    health = 100;
    running = true;

    player.x = 300;
    player.y = 300;

    player.vx = 0;
    player.vy = 0;

    player.web = null;
    player.swinging = false;

    cameraX = 0;

    createEnemies();

    document.getElementById("message")
        .style.display = "none";
}

function gameLoop() {
    if (running) {
        updatePlayer();
        updateEnemies();
        updateCamera();
        updateHUD();

        if (health <= 0) {
            gameOver();
        }
    }

    drawSky();
    drawCity();
    drawWeb();
    drawEnemies();
    drawPlayer();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
